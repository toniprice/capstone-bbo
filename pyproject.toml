[project]
name = "bbo"
version = "0.1.0"
description = "BBO - Capstone Project for Imperial Cert in ML/AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
]

[tool.pylint.format]
max-line-length = 88

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]

[tool.pylint.basic]
good-names = ["X", "Y"]
